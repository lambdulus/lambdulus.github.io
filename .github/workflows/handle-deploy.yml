name: Remote Dispatch Event Responder

# Controls when the workflow will run
on: [repository_dispatch]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Event Handle - Execute the deployment process
      uses: actions/checkout@v4
      with:
        # Repository name with owner. For example, actions/checkout
        repository: 'lambdulus/frontend'
        ref: 'master'
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: |
        npm ci
        REACT_APP_VERSION_INFO=$(date +"%m-%d-%y-%T") REACT_APP_COMMIT=$(git rev-parse HEAD) PUBLIC_URL=https://lambdulus.github.io npm run build --if-present
      env:
        # Stopgap: CRA4/webpack4 needs the legacy OpenSSL provider on Node 17+.
        # Remove once frontend's react-scripts is upgraded.
        NODE_OPTIONS: --openssl-legacy-provider
    - name: Checkout the current repo
      uses: actions/checkout@v4
      with:
        path: 'web'
    - run: |
        rm -rf ./web/*
        mv ./build/* ./web/
    - run: |
        cd ./web
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add .
        git commit -m "deploy"
        # Re-runs can race a live deploy; rebase and retry the push
        # instead of failing on a stale checkout.
        for i in 1 2 3; do
          git fetch origin
          git rebase origin/master && git push && break
          git rebase --abort
          sleep 5
        done
